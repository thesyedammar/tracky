<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tracky — PDF</title>
<style>
  /* ── Tokens ────────────────────────────────────────────────────────────────
     The same language as the panel and the options page: two neutrals, one gold
     accent family, ok/bad. Keep the block in sync when a token changes. */
  :root {
    --bg: #0B0F18;
    --bg-soft: #131824;
    --surface: rgba(255, 255, 255, .045);
    --surface-2: rgba(255, 255, 255, .075);
    --line: rgba(255, 255, 255, .085);
    --line-2: rgba(255, 255, 255, .16);
    --ink: #E9EDF5;
    --ink-2: #AAB3C2;
    --ink-3: #7C8698;
    --gold: #F5C453;
    --gold-deep: #E19B2C;
    --bad: #F26D6D;
    --ring: rgba(245, 196, 83, .68);
    --e-out: cubic-bezier(.16, 1, .3, 1);
    --d1: 120ms; --d2: 180ms; --d3: 260ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar {
    position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 5;
    display: flex; align-items: center; gap: 11px; padding: 0 16px;
    background: rgba(11, 15, 24, .9); backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    animation: tBar 320ms var(--e-out) both;
  }
  @keyframes tBar { from { opacity: 0; transform: translateY(-6px); } }
  #bar .mark {
    width: 16px; height: 16px; border-radius: 5px; flex: none;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  }
  #bar b { font-weight: 650; letter-spacing: .2px; }
  #name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  #bar .sep { width: 1px; height: 18px; background: var(--line); flex: none; }
  #meta {
    margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums;
    font-size: 12.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
  }
  #hint { color: var(--ink-3); font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
  kbd {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 3px 5px;
  }
  @media (max-width: 720px) { #hint { display: none; } }
  #pages { padding: 68px 0 60px; display: flex; flex-direction: column; align-items: center; gap: 24px; transition: padding var(--d3) var(--e-out); }
  /* The panel floats on the right; when it is open the document slides left so it
     is never covered (no re-render needed — the pages just re-center). The gap comes
     from --panel-w, which pdf-viewer.js measures from the panel itself. */
  body.panel-open #pages { padding-right: calc(var(--panel-w, 392px) + 16px); }
  @media (prefers-reduced-motion: reduce) { #pages { transition: none; } }
  .page {
    position: relative; background: #fff; border-radius: 4px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 34px rgba(0, 0, 0, .45);
  }
  .page canvas { display: block; border-radius: 4px; transition: opacity 260ms var(--e-out); }
  /* A page whose pixels are not painted yet: the canvas stays invisible and a light
     sweeps across the sheet, so a blank white page never reads as a broken one.
     Gated on data-near (set by the reader's own observer) so a 300-page document
     does not run a hundred animations for pages nobody has scrolled to. */
  .page[data-pending="1"] canvas { opacity: 0; }
  .page[data-near="1"][data-pending="1"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 35%, rgba(11, 15, 24, .06) 50%, transparent 65%);
    animation: tSheet 1.3s linear infinite;
  }
  @keyframes tSheet { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  /* pdf.js text layer — the spans are invisible but selectable, and they are what
     Tracky highlights, so a hit glows on the PDF itself. */
  .textLayer {
    position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1;
    forced-color-adjust: none; text-size-adjust: none;
  }
  .textLayer span, .textLayer br {
    color: transparent; position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%;
  }
  .textLayer span::selection { background: rgba(245, 196, 83, .35); }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; }
  .textLayer .markedContent { top: 0; height: 0; }
  ::highlight(tracky-hl) { background: rgba(245, 196, 83, .26); color: inherit; }
  ::highlight(tracky-hl-now) { background: rgba(245, 196, 83, .55); color: inherit; }
  #load {
    position: fixed; inset: 52px 0 0; display: grid; place-items: center; z-index: 4;
    background: var(--bg);
    transition: opacity 300ms var(--e-out), transform 300ms var(--e-out), visibility 0s linear 300ms;
  }
  #load.gone { opacity: 0; transform: translateY(-8px); visibility: hidden; pointer-events: none; }
  #load .box { text-align: center; color: var(--ink-2); max-width: 520px; padding: 24px; animation: tBox 360ms var(--e-out) both; }
  @keyframes tBox { from { opacity: 0; transform: translateY(6px); } }
  #load .mark {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow: 0 6px 20px rgba(225, 155, 44, .25), inset 0 0 0 1px rgba(255, 255, 255, .16);
    animation: tMark 1.6s var(--e-out) infinite;
  }
  @keyframes tMark { 50% { transform: translateY(-3px); } }
  #load .box b { color: var(--ink); display: block; margin-bottom: 6px; font-size: 15px; letter-spacing: .2px; }
  #load .bar {
    width: 300px; height: 4px; background: var(--surface-2); border-radius: 4px;
    margin: 18px auto 0; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .4);
  }
  #load .bar i {
    display: block; height: 100%; width: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    transform: scaleX(0); transform-origin: 0 50%;
    transition: transform var(--d3) var(--e-out);
  }
  #load .err { color: #FFB3A6; }
  @media (prefers-reduced-motion: reduce) {
    /* Fewer and gentler, not zero: the sheet shimmer, the bob and the bar's fill are
       movement, so they stop; the fades stay (they aid comprehension). */
    #load .mark, .page[data-near="1"][data-pending="1"]::after { animation: none !important; }
    #load .bar i { transition: none !important; }
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="mark"></span><b>Tracky</b>
    <span id="name">…</span>
    <span class="sep"></span>
    <span id="hint"><kbd>Alt</kbd>+<kbd>K</kbd> or <kbd>Ctrl</kbd>+<kbd>F</kbd> · search by meaning</span>
    <span id="meta"></span>
  </div>
  <div id="pages"></div>
  <div id="load"><div class="box"><div class="mark"></div><b id="load-title">Opening the PDF…</b><span id="load-msg">reading the file</span><div class="bar"><i id="load-bar"></i></div></div></div>

  <!-- A synchronous stub (its own file — MV3 forbids inline scripts) so the panel
       gives an honest "still rendering" answer instead of "no text" if someone
       searches in the first seconds. pdf-viewer.js replaces it once pages are up. -->
  <script src="pdf-stub.js"></script>
  <script src="content.js"></script>
  <script type="module" src="pdf-viewer.js"></script>
</body>
</html>
